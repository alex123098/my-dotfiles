onboarding = false
# Herdr configuration — tmux replacement
# Stow: herdr/.config/herdr/config.toml

[keys]
prefix = "ctrl+a"

# Pane focus (prefix-based fallback) — defaults are already prefix+h/j/k/l
# Uncomment to customize:
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"

# Splits — match tmux bindings
# Note: herdr naming is inverted vs tmux terminology
split_vertical = "prefix+backslash" # side-by-side panes (tmux: split-window -h)
split_horizontal = "prefix+minus"   # stacked panes (tmux: split-window -v)

[experimental]
kitty_graphics = true

[theme]
name = "tokyo-night"

[ui]
tab_bar_position = "bottom"
mouse_capture = true
pane_borders = false
pane_gaps = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

# Seamless nvim navigation via aimdevlee/herdr-nvim-nav
# ctrl+h/j/k/l moves within nvim splits, then crosses to adjacent herdr panes
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"