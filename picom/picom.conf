###################
# Rounded corners #
###################

corner-radius = 12;
rounded-conrners-exckude = [
  "class_g = 'firefox'",
  "class_g = 'slop'",
  "class_g = 'dock'",
  "class_g = 'desktop'",
];
round-borders = 12;

###################
#     Shadows     #
###################

shadow = true;
shadow-radius = 7;
shadow-opactity = 0.75;
shadow-offset-x = -7;
shadow-offset-y = -7;
no-dock-shadow = true;

shadow-exclude = [
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

###################
#      Fading     #
###################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.1;
fade-delta = 10;
fade-exclude = [
  "class_g = 'slop'",
  "class_g = 'dock'",
  "class_g = 'desktop'",
];

###################
#  Transparency   #
###################
inactive-opacity = 0.8;
inactive-transparency = 0.75;
frame-opacity = 1;
inactive-opacity-override = true;
active-opacity = 1;
focus-exclude = [
  "class_g = 'slop'",
];
opacity-rule = [
  "95:class_g = 'Spotify'",
  "100:class_g = 'firefox'",
];

#####################
# General Settings  #
#####################

experimental-backends = false;
backend = "glx";
vsync = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-transient = true;
detectl-client-leader = true;
use-damage = true;

wintypes:
{
  normal = { full-shadow = true; };
  menu = { full-shadow = true; };
  tooltip = { fade = true; shadow = false; focus = true; opacity = 0.9; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { full-shadow = true; opacity = 0.9; };
  utility = { full-shadow = true; };
  toolbar = { full-shadow = true; opacity = 0.9; };
};
