######################################
# color settings for bar and windows #
######################################

# make sure Xresources are loaded:
exec --no-startup-id xrdb -merge ~/.Xresources

# Define colors variables:
set_from_resource $bg background
set_from_resource $fg foreground
set_from_resource $black color0
set_from_resource $red color1
set_from_resource $green color2
set_from_resource $yellow color3
set_from_resource $blue color4
set_from_resource $magenta color5
set_from_resource $cyan color6
set_from_resource $lightgrey color7
set_from_resource $darkgrey color8
set_from_resource $white color15

# define colors for windows:

#class		        	border		bground		text		indicator	child_border
client.focused		    	$lightgrey		$blue		$bg		$bg		$bg
client.unfocused	    	$bg		$bg		$fg		$bg		$bg
client.focused_inactive		$bg		$bg		$fg		$bg		$bg
client.urgent		    	$red		$red		$white		$red		$yellow

############################################
# bars settings (input comes from i3blocks) #
############################################

# Start i3bar to display a workspace bar
# (plus the system information i3status finds out, if available)
bar {
	font pango:Noto Sans Regular 10
	status_command i3blocks -c ~/.config/i3/blocks_top.conf
	position top
	i3bar_command i3bar --transparency
	tray_output none

	strip_workspace_numbers yes

	colors {
		separator          #a9b1d6
		background         $bg
		statusline         $white
#                          		border 		        bg		txt		indicator
		focused_workspace	$lightgrey	   	$darkgrey	$white		$magenta
		active_workspace	$blue		      	$lightgrey	$darkgrey	$magenta
		inactive_workspace	$darkgrey   		$darkgrey	$grey		$magenta
		urgent_workspace	$red		    	$red		$white		$magenta
	}
}

bar {
	font pango:Noto Sans Regular 10
	status_command i3blocks -c ~/.config/i3/blocks_bottom.conf
	position bottom
	i3bar_command i3bar --transparency
	tray_padding 4
	workspace_buttons no


	colors {
		separator          #a9b1d6
		background         $bg
		statusline         $white
	}
}
# vim: ft=i3config
