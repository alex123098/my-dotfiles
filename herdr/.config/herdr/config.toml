onboarding = false
# Herdr configuration — tmux replacement
# Stow: herdr/.config/herdr/config.toml

[terminal]
default_shell = "/bin/zsh"

[update]
version_check = false

[keys]
prefix = "ctrl+a"
detach = "prefix+d"
split_vertical = "prefix+backslash" # side-by-side panes (tmux: split-window -h)
split_horizontal = "prefix+minus"   # stacked panes (tmux: split-window -v)
switch_tab = "prefix+1..9"

[experimental]
kitty_graphics = true

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
tab_bar_position = "bottom"
mouse_capture = true
pane_borders = false
pane_gaps = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent", "state_text"]]

[ui.toast]
delivery = "herdr"

# Seamless nvim navigation via aimdevlee/herdr-nvim-nav
# ctrl+h/j/k/l moves within nvim splits, then crosses to adjacent herdr panes
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
