# Global properties
#
# The top properties below are applied to every block, but can be overridden.
separator=false
separator_block_width=0
markup=pango

[simple-2]
full_text=" "
min_width=450
background=#3b4a61

[disk]
label=<span font='FontAwesome' size='large'> </span>
instance=/
command=~/.config/i3/scripts/disk
interval=30
background=#3b4a61
align=center

[simple-2]
full_text=" "
min_width=10
background=#3b4a61

[memory]
label=<span font='FontAwesome' size='large'> </span>
command=~/.config/i3/scripts/memory
interval=2
background=#3b4a61
align=center

[simple-2]
full_text=" "
min_width=10
background=#3b4a61

[cpu_usage]
label=<span font='FontAwesome' size='large'> </span>
command=~/.config/i3/scripts/cpu_usage
interval=2
background=#3b4a61
align=center

[simple-2]
full_text=" "
min_width=10
background=#3b4a61

[CPU-temperature]
label=
command=~/.config/i3/scripts/temperature
interval=30
T_WARN=80
T_CRIT=100
SENSOR_CHIP="acpitz-acpi-0"
background=#3b4a61
align=center

[simple-2]
full_text=" "
min_width=450
background=#3b4a61

[simple-2]
full_text=" "
min_width=40
background=#292e42

[ppd_menu]
full_text=" "
command=~/.config/i3/scripts/power-profiles
color=#407437
background=#292e42

[ppd-status]
command=~/.config/i3/scripts/ppd-status
interval=5
background=#292e42

[simple-2]
full_text="    "
background=#292e42
min_width=20

[battery]
command=~/.config/i3/scripts/battery1
label=
interval=30
background=#292e42

[simple-2]
full_text="    "
background=#292e42
min_width=40

[simple-2]
full_text="  "
min_width=40

[keybindings]
full_text=<span font='FontAwesome' size='large'></span>

[simple-2]
full_text="   "

[keyboard-layout]
command=~/.config/i3/scripts/keyboard-layout
interval=1

[simple-2]
full_text=" "
min_width=20

[pavucontrol]
full_text=<span font='FontAwesome' size='large'></span>
command=pavucontrol

[simple-2]
full_text="  "

[volume-pulseaudio]
command=~/.config/i3/scripts/volume
instance=Master
interval=1

[simple-2]
full_text="  "
min_width=40

[shutdown_menu]
full_text=
command=~/.config/i3/scripts/powermenu
markup=pango
align=center
min_width=30
background=#303751
